# 日本活动信息自动推送 - GitHub Actions 工作流
name: Japan Events Daily Push

on:
  # 定时触发：每天8:00和16:00（北京时间）
  schedule:
    - cron: '0 0 * * *'   # 每天 08:00 UTC = 16:00 北京时间
    - cron: '0 8 * * *'   # 每天 16:00 UTC = 00:00 北京时间
  # 手动触发
  workflow_dispatch:
  # 代码推送时触发（可选，用于测试）
  push:
    branches:
      - main

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      # 4. 运行采集和推送脚本
      - name: Run Japan Events Fetcher
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python src/main.py
        continue-on-error: true

      # 5. 上传日志（用于排查问题）
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-logs
          path: push.log
          retention-days: 7
